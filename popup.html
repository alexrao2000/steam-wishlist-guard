<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; width: 380px; max-height: 520px; overflow-y: auto;
    background: #1b2838; color: #c7d5e0;
    font: 13px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  header {
    padding: 12px 14px; border-bottom: 1px solid #2a475e;
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  }
  h1 { margin: 0; font-size: 14px; font-weight: 600; color: #fff; }
  #status { font-size: 11px; color: #8f98a0; }
  button {
    font: inherit; border: 1px solid #2a475e; background: #2a475e; color: #c7d5e0;
    border-radius: 3px; padding: 4px 10px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #3d6c8d; }
  button:disabled { opacity: .45; cursor: default; }
  #list { list-style: none; margin: 0; padding: 0; }
  li { padding: 10px 14px; border-bottom: 1px solid #21364a; display: flex; gap: 10px; align-items: center; }
  li.restored { opacity: .5; }
  .meta { flex: 1; min-width: 0; }
  .name { color: #fff; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { color: #66c0f4; text-decoration: underline; }
  .when { font-size: 11px; color: #8f98a0; }
  .empty { padding: 22px 14px; color: #8f98a0; text-align: center; }
  footer { padding: 10px 14px; border-top: 1px solid #2a475e; display: flex; justify-content: space-between; align-items: center; }
  .err { color: #e9917d; font-size: 11px; padding: 0 14px 10px; }
</style>
<header>
  <h1>Wishlist Guard</h1>
  <span id="status">…</span>
</header>
<div class="err" id="err" hidden></div>
<ul id="list"></ul>
<footer>
  <button id="check">Check now</button>
  <button id="clear">Clear log</button>
</footer>
<script src="popup.js"></script>
